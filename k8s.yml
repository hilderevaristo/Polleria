apiVersion: apps/v1
kind: Deployment
metadata:
  name: polleria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polleria
  template:
    metadata:
      labels:
        app: polleria
    spec:
      containers:
        - name: polleria
          image: polleria:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: polleria-db-secret
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: polleria-db-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polleria-db-secret
                  key: SPRING_DATASOURCE_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: polleria-service
spec:
  type: LoadBalancer
  selector:
    app: polleria
  ports:
    - port: 8080
      targetPort: 8080