version: '3.8'

services:
  # 1. Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: polleria-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 74418228
      MYSQL_DATABASE: bd_integrador
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p74418228"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Tu Aplicación Spring Boot
  app:
    build: .
    container_name: polleria-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Aquí le pasamos los datos al application.properties
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bd_integrador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 74418228

volumes:
  mysql_data: