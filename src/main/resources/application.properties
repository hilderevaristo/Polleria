spring.application.name=ProyectoFianal_Integrador

# --- CONEXIÓN A SUPABASE (POSTGRESQL) ---
# Quitamos los valores por defecto de MySQL local para que Render use sus variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Cambiamos el dialecto de MySQL a PostgreSQL (Supabase)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ¡ESTO ES LO NUEVO E IMPORTANTE!
spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always

server.port=8080