name: Keep Render Alive

on:
  schedule:
    # Se ejecuta cada 10 minutos
    cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping to Render
        run: curl -s https://polleria-ydsv.onrender.com > /dev/null